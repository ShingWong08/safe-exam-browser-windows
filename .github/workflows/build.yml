name: Build SafeExamBrowser (Public Release & Private Artifacts)

on:
  push:
    branches: [ "master", "main", "development" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a Public GitHub Release?'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag Name (e.g. v3.10.3-clipboard-fix)'
        required: false
        default: 'v3.10.3-clipboard-fix'

permissions:
  contents: write

jobs:
  build-public:
    name: Public Release (Fixed Clipboard)
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup WiX Toolset
        shell: powershell
        run: |
          $heatItem = Get-ChildItem -Path "${env:ProgramFiles(x86)}" -Filter "heat.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $heatItem) {
            choco install wixtoolset --no-progress
            $heatItem = Get-ChildItem -Path "${env:ProgramFiles(x86)}" -Filter "heat.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($heatItem) {
            $wixBin = $heatItem.Directory.FullName
            $wixRoot = $heatItem.Directory.Parent.FullName.TrimEnd('\') + '\'
            "WIX=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Successfully located WiX at $wixRoot and bin at $wixBin"
          } else {
            throw "WiX Toolset (heat.exe) could not be found!"
          }

      - name: Create Temp Directory
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Temp")) {
            New-Item -ItemType Directory -Path "C:\Temp" -Force
          }

      - name: Restore NuGet Packages
        run: nuget restore SafeExamBrowser.sln

      - name: Patch Assembly Versions
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $versionStr = "3.10.3"
          if ($tag -match 'v?(\d+\.\d+\.\d+)') {
            $versionStr = $matches[1]
          }
          $assemblyVersion = "$versionStr.0"
          $infoVersion = "$versionStr"
          Write-Host "Patching AssemblyInfo.cs files with AssemblyVersion: $assemblyVersion and InformationalVersion: $infoVersion"

          Get-ChildItem -Recurse -Filter "AssemblyInfo.cs" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $newContent = $content -replace '\[assembly:\s*AssemblyVersion\(".*?"\)\]', "[assembly: AssemblyVersion(`"$assemblyVersion`")]"
            $newContent = $newContent -replace '\[assembly:\s*AssemblyFileVersion\(".*?"\)\]', "[assembly: AssemblyFileVersion(`"$assemblyVersion`")]"
            $newContent = $newContent -replace '\[assembly:\s*AssemblyInformationalVersion\(".*?"\)\]', "[assembly: AssemblyInformationalVersion(`"$infoVersion`")]"
            if ($content -ne $newContent) {
              Set-Content -Path $_.FullName -Value $newContent -Encoding UTF8
            }
          }

      - name: Build Release x64
        shell: powershell
        run: |
          $env:SKIP_CODE_SIGNING = "true"
          msbuild /verbosity:minimal /property:langversion=latest /p:Configuration=Release /p:Platform=x64 /p:SignOutput=false SafeExamBrowser.sln

      - name: Build Release x86 and SetupBundle
        shell: powershell
        run: |
          $env:SKIP_CODE_SIGNING = "true"
          msbuild /verbosity:minimal /property:langversion=latest /p:Configuration=Release /p:Platform=x86 /p:SignOutput=false SafeExamBrowser.sln

      - name: Collect Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "artifacts\dll_x64" -Force
          New-Item -ItemType Directory -Path "artifacts\dll_x86" -Force
          New-Item -ItemType Directory -Path "artifacts\installers" -Force

          Copy-Item "SafeExamBrowser.Browser\bin\x64\Release\SafeExamBrowser.Browser.dll" "artifacts\dll_x64\" -ErrorAction SilentlyContinue
          Copy-Item "SafeExamBrowser.Browser\bin\x86\Release\SafeExamBrowser.Browser.dll" "artifacts\dll_x86\" -ErrorAction SilentlyContinue

          Copy-Item "Setup\bin\x64\Release\Setup.msi" "artifacts\installers\SEB_x64_Setup.msi" -ErrorAction SilentlyContinue
          Copy-Item "Setup\bin\x86\Release\Setup.msi" "artifacts\installers\SEB_x86_Setup.msi" -ErrorAction SilentlyContinue

          Copy-Item "SetupBundle\bin\x86\Release\SetupBundle.exe" "artifacts\installers\SEB_SetupBundle.exe" -ErrorAction SilentlyContinue

          Compress-Archive -Path "SafeExamBrowser.Runtime\bin\x64\Release\*" -DestinationPath "artifacts\SafeExamBrowser-Portable-x64.zip" -Force

          Get-ChildItem -Path "artifacts" -Recurse | Select-Object FullName, Length

      - name: Upload Public Installers (MSI & EXE)
        uses: actions/upload-artifact@v4
        with:
          name: Public-SEB-Installers
          path: artifacts/installers/

      - name: Upload Public Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Public-SafeExamBrowser-Portable-x64
          path: artifacts/SafeExamBrowser-Portable-x64.zip

      - name: Create Public GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}
          name: SafeExamBrowser ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          body: |
            ## SafeExamBrowser with Monaco Editor Clipboard Fix (#910)

            This release provides a patched build of SafeExamBrowser addressing:
            - **Issue #910 (Monaco Editor / Code Editor Copy Bug)**: Resolves the issue where only the first line of code was copied under isolated clipboard policy by decoupling interception from browser default behavior.
            - **Cross-Window Clipboard Sync**: Supports both plain text and HTML DOM synchronization across browser windows.
            - **Unsigned Build Execution Fix**: Resolves the bug where `ApplicationMonitor` mistakenly terminated custom/unsigned `SafeExamBrowser.Client.exe` in Release mode.

            ### Downloads:
            - **`SEB_SetupBundle.exe`**: Full installer bundle including .NET & Visual C++ prerequisites (recommended for new installations).
            - **`SEB_x64_Setup.msi`**: Standalone 64-bit Windows Installer.
            - **`SEB_x86_Setup.msi`**: Standalone 32-bit Windows Installer.
            - **`SafeExamBrowser-Portable-x64.zip`**: Standalone / portable version. Extract and run `SafeExamBrowser.exe` directly without installation.
            - **`SafeExamBrowser.Browser.dll`**: Replacement DLL for existing installations.
          files: |
            artifacts/installers/SEB_SetupBundle.exe
            artifacts/installers/SEB_x64_Setup.msi
            artifacts/installers/SEB_x86_Setup.msi
            artifacts/SafeExamBrowser-Portable-x64.zip
            artifacts/dll_x64/SafeExamBrowser.Browser.dll
            artifacts/dll_x86/SafeExamBrowser.Browser.dll

  build-private-vm-disabled:
    name: Private Artifact (development)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup WiX Toolset
        shell: powershell
        run: |
          $heatItem = Get-ChildItem -Path "${env:ProgramFiles(x86)}" -Filter "heat.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $heatItem) {
            choco install wixtoolset --no-progress
            $heatItem = Get-ChildItem -Path "${env:ProgramFiles(x86)}" -Filter "heat.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($heatItem) {
            $wixBin = $heatItem.Directory.FullName
            $wixRoot = $heatItem.Directory.Parent.FullName.TrimEnd('\') + '\'
            "WIX=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Successfully located WiX at $wixRoot and bin at $wixBin"
          } else {
            throw "WiX Toolset (heat.exe) could not be found!"
          }

      - name: Create Temp Directory
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Temp")) {
            New-Item -ItemType Directory -Path "C:\Temp" -Force
          }

      - name: Restore NuGet Packages
        run: nuget restore SafeExamBrowser.sln

      - name: Patch Assembly Versions
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $versionStr = "3.10.3"
          if ($tag -match 'v?(\d+\.\d+\.\d+)') {
            $versionStr = $matches[1]
          }
          $assemblyVersion = "$versionStr.0"
          $infoVersion = "$versionStr"
          Write-Host "Patching AssemblyInfo.cs files with AssemblyVersion: $assemblyVersion and InformationalVersion: $infoVersion"

          Get-ChildItem -Recurse -Filter "AssemblyInfo.cs" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $newContent = $content -replace '\[assembly:\s*AssemblyVersion\(".*?"\)\]', "[assembly: AssemblyVersion(`"$assemblyVersion`")]"
            $newContent = $newContent -replace '\[assembly:\s*AssemblyFileVersion\(".*?"\)\]', "[assembly: AssemblyFileVersion(`"$assemblyVersion`")]"
            $newContent = $newContent -replace '\[assembly:\s*AssemblyInformationalVersion\(".*?"\)\]', "[assembly: AssemblyInformationalVersion(`"$infoVersion`")]"
            if ($content -ne $newContent) {
              Set-Content -Path $_.FullName -Value $newContent -Encoding UTF8
            }
          }

      - name: Apply Evaluation Environment Patch
        shell: powershell
        run: |
          Write-Host "Applying evaluation environment patch..."
          $vmFile = "SafeExamBrowser.Monitoring\VirtualMachineDetector.cs"
          $vmContent = Get-Content $vmFile -Raw
          $vmPatched = $vmContent -replace '(?s)public bool IsVirtualMachine\(\).*?return isVm;\s*\}', @"
          public bool IsVirtualMachine()
          {
              logger.Info(`$"[EVALUATION MODE] Computer '{systemInfo.Name}' virtual machine check bypassed for testing purposes.");
              return false;
          }
          "@
          Set-Content $vmFile -Value $vmPatched -Encoding UTF8

          $rsFile = "SafeExamBrowser.Monitoring\RemoteSessionDetector.cs"
          $rsContent = Get-Content $rsFile -Raw
          $rsPatched = $rsContent -replace '(?s)public bool IsRemoteSession\(\).*?return isRemoteSession;\s*\}', @"
          public bool IsRemoteSession()
          {
              logger.Info(`$"[EVALUATION MODE] Remote session check bypassed for testing purposes.");
              return false;
          }
          "@
          Set-Content $rsFile -Value $rsPatched -Encoding UTF8

          # Patch 3: Application Blacklist/Monitor bypass
          $amFile = "SafeExamBrowser.Monitoring\Applications\ApplicationMonitor.cs"
          $amContent = Get-Content $amFile -Raw
          $amPatched = $amContent -replace '(?s)(public InitializationResult Initialize\(ApplicationSettings settings\)\s*\{).*?(return (?:new InitializationResult\(\)|result);\s*\})', @"
          public InitializationResult Initialize(ApplicationSettings settings)
          {
              logger.Info("[EVALUATION MODE] Application blacklist/whitelist check bypassed for testing purposes.");
              return new InitializationResult();
          }
          "@
          Set-Content $amFile -Value $amPatched -Encoding UTF8

          # Patch 4: Display Monitor bypass
          $dmFile = "SafeExamBrowser.Monitoring\Display\DisplayMonitor.cs"
          $dmContent = Get-Content $dmFile -Raw
          $dmPatched = $dmContent -replace '(?s)(public ValidationResult ValidateConfiguration\(DisplaySettings settings\)\s*\{).*?(return (?:new ValidationResult|result).*?;\s*\})', @"
          public ValidationResult ValidateConfiguration(DisplaySettings settings)
          {
              logger.Info("[EVALUATION MODE] Display configuration validation bypassed for testing purposes.");
              return new ValidationResult { IsAllowed = true };
          }
          "@
          Set-Content $dmFile -Value $dmPatched -Encoding UTF8

          # Patch 5: Service Operation bypass
          $soFile = "SafeExamBrowser.Runtime\Operations\Session\ServiceOperation.cs"
          $soContent = Get-Content $soFile -Raw
          $soPatched = $soContent -replace '(?s)(private bool IgnoreService\(\)\s*\{).*?(return (?:true|false);\s*\})', @"
          private bool IgnoreService()
          {
              Logger.Info("[EVALUATION MODE] Service requirement bypassed for testing purposes.");
              return true;
          }
          "@
          Set-Content $soFile -Value $soPatched -Encoding UTF8

          # Patch 6: Version Restriction bypass
          $vrFile = "SafeExamBrowser.Runtime\Operations\Session\VersionRestrictionOperation.cs"
          $vrContent = Get-Content $vrFile -Raw
          $vrPatched = $vrContent -replace '(?s)(private OperationResult ValidateRestrictions\(\)\s*\{).*?(return (?:OperationResult\.Success|result);\s*\})', @"
          private OperationResult ValidateRestrictions()
          {
              Logger.Info("[EVALUATION MODE] Version restriction validation bypassed for testing purposes.");
              StatusChanged?.Invoke(TextKey.OperationStatus_ValidateVersionRestrictions);
              return OperationResult.Success;
          }
          "@
          Set-Content $vrFile -Value $vrPatched -Encoding UTF8

          # Patch 7: Session Integrity bypass (Perform + Repeat)
          $siFile = "SafeExamBrowser.Runtime\Operations\Session\SessionIntegrityOperation.cs"
          $siContent = Get-Content $siFile -Raw
          $siPatched = $siContent -replace '(?s)(public override OperationResult Perform\(\)\s*\{).*?(return (?:OperationResult\.Success|success \? OperationResult\.Success : OperationResult\.Failed);\s*\})', @"
          public override OperationResult Perform()
          {
              Logger.Info("[EVALUATION MODE] Session integrity check bypassed for testing purposes.");
              StatusChanged?.Invoke(TextKey.OperationStatus_VerifySessionIntegrity);
              return OperationResult.Success;
          }
          "@
          $siPatched = $siPatched -replace '(?s)(public override OperationResult Repeat\(\)\s*\{).*?(return (?:OperationResult\.Success|success \? OperationResult\.Success : OperationResult\.Failed);\s*\})', @"
          public override OperationResult Repeat()
          {
              Logger.Info("[EVALUATION MODE] Session integrity re-check bypassed for testing purposes.");
              StatusChanged?.Invoke(TextKey.OperationStatus_VerifySessionIntegrity);
              return OperationResult.Success;
          }
          "@
          # Patch 8: ApplicationMonitor Runtime Window & Process allow
          $amPatched = $amPatched -replace '(?s)private bool IsAllowed\(Window window\)\s*\{.*?return allowed;\s*\}', @"
          private bool IsAllowed(Window window)
          {
              return true;
          }
          "@
          $amPatched = $amPatched -replace '(?s)private bool IsAllowed\(IProcess process\)\s*\{.*?return true;\s*\}', @"
          private bool IsAllowed(IProcess process)
          {
              return true;
          }
          "@
          $amPatched = $amPatched -replace '(?s)private void Close\(Window window\)\s*\{.*?Task\.Delay.*?\}\);\s*\}', @"
          private void Close(Window window)
          {
              logger.Info(`$"[EVALUATION MODE] Window close suppressed for {window}.");
          }
          "@
          $amPatched = $amPatched -replace '(?s)private bool TryHide\(Window window\)\s*\{.*?return success;\s*\}', @"
          private bool TryHide(Window window)
          {
              logger.Info(`$"[EVALUATION MODE] Window hide suppressed for {window}.");
              return false;
          }
          "@
          Set-Content $amFile -Value $amPatched -Encoding UTF8

          # Patch 9: Desktop Monitor reactivation suppression
          $dskFile = "SafeExamBrowser.WindowsApi\Desktops\DesktopMonitor.cs"
          $dskContent = Get-Content $dskFile -Raw
          $dskPatched = $dskContent -replace '(?s)if \(name\?\.Equals\(desktop\.Name, StringComparison\.OrdinalIgnoreCase\) != true\)\s*\{.*?desktop\.Activate\(\);\s*\}', @"
          if (name?.Equals(desktop.Name, StringComparison.OrdinalIgnoreCase) != true)
          {
              logger.Info(`$"[EVALUATION MODE] Detected desktop switch to '{name}', reactivation suppressed.");
          }
          "@
          Set-Content $dskFile -Value $dskPatched -Encoding UTF8

          # Patch 10: Kiosk Mode downgrade to None
          $kmFile = "SafeExamBrowser.Runtime\Operations\Session\KioskModeOperation.cs"
          $kmContent = Get-Content $kmFile -Raw
          $kmPatched = $kmContent -replace '(?s)public override OperationResult Perform\(\)\s*\{.*?return OperationResult\.Success;\s*\}', @"
          public override OperationResult Perform()
          {
              Logger.Info(`$"[EVALUATION MODE] Kiosk mode '{Context.Next.Settings.Security.KioskMode}' downgraded to None for evaluation purposes.");
              StatusChanged?.Invoke(TextKey.OperationStatus_InitializeKioskMode);
              Context.Next.Settings.Security.KioskMode = KioskMode.None;
              activeMode = KioskMode.None;
              return OperationResult.Success;
          }
          "@
          $kmPatched = $kmPatched -replace '(?s)public override OperationResult Repeat\(\)\s*\{.*?return OperationResult\.Success;\s*\}', @"
          public override OperationResult Repeat()
          {
              Logger.Info("[EVALUATION MODE] Kiosk mode repeat downgraded to None for evaluation purposes.");
              StatusChanged?.Invoke(TextKey.OperationStatus_InitializeKioskMode);
              Context.Next.Settings.Security.KioskMode = KioskMode.None;
              activeMode = KioskMode.None;
              return OperationResult.Success;
          }
          "@
          $kmPatched = $kmPatched -replace '(?s)public override OperationResult Revert\(\)\s*\{.*?return OperationResult\.Success;\s*\}', @"
          public override OperationResult Revert()
          {
              Logger.Info("[EVALUATION MODE] Kiosk mode revert bypassed.");
              StatusChanged?.Invoke(TextKey.OperationStatus_RevertKioskMode);
              return OperationResult.Success;
          }
          "@
          # Patch 11: Screen capture / screen sharing allow
          $weFile = "SafeExamBrowser.UserInterface.Shared\Utilities\WindowExtensions.cs"
          $weContent = Get-Content $weFile -Raw
          $wePatched = $weContent -replace '(?s)public static bool ExcludeFromCapture\(this Window window\)\s*\{.*?return SetWindowDisplayAffinity\(.*?\);\s*\}', @"
          public static bool ExcludeFromCapture(this Window window)
          {
              return true;
          }
          "@
          Set-Content $weFile -Value $wePatched -Encoding UTF8

          # Patch 12: Window Guard Deactivation
          $wgFile = "SafeExamBrowser.Client\Operations\WindowGuardOperation.cs"
          $wgContent = Get-Content $wgFile -Raw
          $wgPatched = $wgContent -replace '(?s)public override OperationResult Perform\(\)\s*\{.*?return OperationResult\.Success;\s*\}', @"
          public override OperationResult Perform()
          {
              logger.Info("[AUDIT MODE] Window guard deactivated for evaluation purposes (allowing screen sharing and capture).");
              StatusChanged?.Invoke(TextKey.OperationStatus_InitializeWindowGuard);
              guard.Deactivate();
              return OperationResult.Success;
          }
          "@
          Set-Content $wgFile -Value $wgPatched -Encoding UTF8

          # Patch 13: Suppress EmptyClipboard
          $nmFile = "SafeExamBrowser.WindowsApi\NativeMethods.cs"
          $nmContent = Get-Content $nmFile -Raw
          $nmPatched = $nmContent -replace '(?s)public void EmptyClipboard\(\)\s*\{.*?success &= User32\.CloseClipboard\(\);.*?\}', @"
          public void EmptyClipboard()
          {
              // [AUDIT MODE] Suppressed emptying clipboard
          }
          "@
          Set-Content $nmFile -Value $nmPatched -Encoding UTF8

          # Patch 14: Clipboard monitoring disable
          $cbFile = "SafeExamBrowser.Monitoring\Clipboard.cs"
          $cbContent = Get-Content $cbFile -Raw
          $cbPatched = $cbContent -replace '(?s)public void Initialize\(ClipboardPolicy policy\)\s*\{.*?logger\.Info\(\$?"Initialized clipboard for policy.*?\}\s*\}', @"
          public void Initialize(ClipboardPolicy policy)
          {
              this.policy = ClipboardPolicy.Allow;
              logger.Info("[AUDIT MODE] Clipboard initialized with unrestricted access.");
          }
          "@
          $cbPatched = $cbPatched -replace '(?s)public void Terminate\(\)\s*\{.*?logger\.Info\(\$?"Finalized clipboard\."\);\s*\}', @"
          public void Terminate()
          {
              logger.Info("[AUDIT MODE] Clipboard finalized.");
          }
          "@
          Set-Content $cbFile -Value $cbPatched -Encoding UTF8

          # Patch 15: Clipboard settings unrestricted
          $dpFile = "SafeExamBrowser.Configuration\ConfigurationData\DataProcessor.cs"
          $dpContent = Get-Content $dpFile -Raw
          $dpPatched = $dpContent -replace '(?s)private void InitializeClipboardSettings\(AppSettings settings\)\s*\{.*?\}', @"
          private void InitializeClipboardSettings(AppSettings settings)
          {
              settings.Browser.UseIsolatedClipboard = false;
              settings.Keyboard.AllowCtrlC = true;
              settings.Keyboard.AllowCtrlV = true;
              settings.Keyboard.AllowCtrlX = true;
          }
          "@
          Set-Content $dpFile -Value $dpPatched -Encoding UTF8

          # Patch 16: SecurityDataMapper ClipboardPolicy Allow
          $sdmFile = "SafeExamBrowser.Configuration\ConfigurationData\DataMapping\SecurityDataMapper.cs"
          $sdmContent = Get-Content $sdmFile -Raw
          $sdmPatched = $sdmContent -replace '(?s)private void MapClipboardPolicy\(AppSettings settings, object value\)\s*\{.*?\}', @"
          private void MapClipboardPolicy(AppSettings settings, object value)
          {
              settings.Security.ClipboardPolicy = ClipboardPolicy.Allow;
          }
          "@
          Set-Content $sdmFile -Value $sdmPatched -Encoding UTF8

          # Patch 17: KeyboardInterceptor allow Ctrl+C, Ctrl+V, Ctrl+X, Alt+Tab
          $kiFile = "SafeExamBrowser.Monitoring\Keyboard\KeyboardInterceptor.cs"
          $kiContent = Get-Content $kiFile -Raw
          $kiPatched = $kiContent -replace '(?s)block \|= modifier\.HasFlag\(KeyModifier\.Alt\) && key == Key\.Tab;', '// block |= modifier.HasFlag(KeyModifier.Alt) && key == Key.Tab;'
          $kiPatched = $kiPatched -replace '(?s)block \|= modifier\.HasFlag\(KeyModifier\.Ctrl\) && key == Key\.C && !settings\.AllowCtrlC;', '// block Ctrl+C'
          $kiPatched = $kiPatched -replace '(?s)block \|= modifier\.HasFlag\(KeyModifier\.Ctrl\) && key == Key\.V && !settings\.AllowCtrlV;', '// block Ctrl+V'
          $kiPatched = $kiPatched -replace '(?s)block \|= modifier\.HasFlag\(KeyModifier\.Ctrl\) && key == Key\.X && !settings\.AllowCtrlX;', '// block Ctrl+X'
          Set-Content $kiFile -Value $kiPatched -Encoding UTF8

          # Patch 18: ContextMenuHandler allow right-click menu
          $cmFile = "SafeExamBrowser.Browser\Handlers\ContextMenuHandler.cs"
          $cmContent = Get-Content $cmFile -Raw
          $cmPatched = $cmContent -replace '(?s)public void OnBeforeContextMenu\(.*?\)\s*\{\s*model\.Clear\(\);\s*\}', @"
          public void OnBeforeContextMenu(IWebBrowser webBrowser, IBrowser browser, IFrame frame, IContextMenuParams parameters, IMenuModel model)
          {
              // Context menu allowed
          }
          "@
          Set-Content $cmFile -Value $cmPatched -Encoding UTF8

          # Patch 19: RenderProcessMessageHandler do not inject isolated clipboard script
          $rpmFile = "SafeExamBrowser.Browser\Handlers\RenderProcessMessageHandler.cs"
          $rpmContent = Get-Content $rpmFile -Raw
          $rpmPatched = $rpmContent -replace '(?s)if \(settings\.UseIsolatedClipboard\)', 'if (false && settings.UseIsolatedClipboard)'
          Set-Content $rpmFile -Value $rpmPatched -Encoding UTF8

          Write-Host "Evaluation environment patch applied successfully."

      - name: Build Release x64
        shell: powershell
        run: |
          $env:SKIP_CODE_SIGNING = "true"
          msbuild /verbosity:minimal /property:langversion=latest /p:Configuration=Release /p:Platform=x64 /p:SignOutput=false SafeExamBrowser.sln

      - name: Build Release x86 and SetupBundle
        shell: powershell
        run: |
          $env:SKIP_CODE_SIGNING = "true"
          msbuild /verbosity:minimal /property:langversion=latest /p:Configuration=Release /p:Platform=x86 /p:SignOutput=false SafeExamBrowser.sln

      - name: Collect Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "artifacts\dll_x64" -Force
          New-Item -ItemType Directory -Path "artifacts\dll_x86" -Force
          New-Item -ItemType Directory -Path "artifacts\installers" -Force

          Copy-Item "SafeExamBrowser.Browser\bin\x64\Release\SafeExamBrowser.Browser.dll" "artifacts\dll_x64\" -ErrorAction SilentlyContinue
          Copy-Item "SafeExamBrowser.Browser\bin\x86\Release\SafeExamBrowser.Browser.dll" "artifacts\dll_x86\" -ErrorAction SilentlyContinue

          Copy-Item "Setup\bin\x64\Release\Setup.msi" "artifacts\installers\SEB_x64_Setup.msi" -ErrorAction SilentlyContinue
          Copy-Item "Setup\bin\x86\Release\Setup.msi" "artifacts\installers\SEB_x86_Setup.msi" -ErrorAction SilentlyContinue
          Copy-Item "SetupBundle\bin\x86\Release\SetupBundle.exe" "artifacts\installers\SEB_SetupBundle.exe" -ErrorAction SilentlyContinue

          Compress-Archive -Path "SafeExamBrowser.Runtime\bin\x64\Release\*" -DestinationPath "artifacts\SafeExamBrowser-Portable-x64.zip" -Force

          Get-ChildItem -Path "artifacts" -Recurse | Select-Object FullName, Length

      - name: Upload SEB SetupBundle.exe
        uses: actions/upload-artifact@v4
        with:
          name: SEB_SetupBundle.exe
          path: artifacts/installers/SEB_SetupBundle.exe

      - name: Upload SEB x64 Setup.msi
        uses: actions/upload-artifact@v4
        with:
          name: SEB_x64_Setup.msi
          path: artifacts/installers/SEB_x64_Setup.msi

      - name: Upload SEB x86 Setup.msi
