name: Build and Release SafeExamBrowser

on:
  push:
    branches: [ "master", "main", "audit/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release?'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag Name (e.g. v3.10.3-clipboard-fix)'
        required: false
        default: 'v3.10.3-clipboard-fix'

permissions:
  contents: write

jobs:
  build:
    name: Build Browser, DLL, MSI, EXE and Release
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup WiX Toolset
        shell: powershell
        run: |
          $heatItem = Get-ChildItem -Path "${env:ProgramFiles(x86)}" -Filter "heat.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $heatItem) {
            choco install wixtoolset --no-progress
            $heatItem = Get-ChildItem -Path "${env:ProgramFiles(x86)}" -Filter "heat.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($heatItem) {
            $wixBin = $heatItem.Directory.FullName
            $wixRoot = $heatItem.Directory.Parent.FullName.TrimEnd('\') + '\'
            "WIX=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Successfully located WiX at $wixRoot and bin at $wixBin"
          } else {
            throw "WiX Toolset (heat.exe) could not be found!"
          }

      - name: Create Temp Directory
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Temp")) {
            New-Item -ItemType Directory -Path "C:\Temp" -Force
          }

      - name: Restore NuGet Packages
        run: nuget restore SafeExamBrowser.sln

      - name: Build Release x64
        shell: powershell
        run: |
          $env:SKIP_CODE_SIGNING = "true"
          msbuild /verbosity:minimal /property:langversion=latest /p:Configuration=Release /p:Platform=x64 /p:SignOutput=false SafeExamBrowser.sln

      - name: Build Release x86 and SetupBundle
        shell: powershell
        run: |
          $env:SKIP_CODE_SIGNING = "true"
          msbuild /verbosity:minimal /property:langversion=latest /p:Configuration=Release /p:Platform=x86 /p:SignOutput=false SafeExamBrowser.sln

      - name: Collect Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "artifacts\dll_x64" -Force
          New-Item -ItemType Directory -Path "artifacts\dll_x86" -Force
          New-Item -ItemType Directory -Path "artifacts\installers" -Force

          Copy-Item "SafeExamBrowser.Browser\bin\x64\Release\SafeExamBrowser.Browser.dll" "artifacts\dll_x64\" -ErrorAction SilentlyContinue
          Copy-Item "SafeExamBrowser.Browser\bin\x86\Release\SafeExamBrowser.Browser.dll" "artifacts\dll_x86\" -ErrorAction SilentlyContinue

          Copy-Item "Setup\bin\x64\Release\Setup.msi" "artifacts\installers\SEB_x64_Setup.msi" -ErrorAction SilentlyContinue
          Copy-Item "Setup\bin\x86\Release\Setup.msi" "artifacts\installers\SEB_x86_Setup.msi" -ErrorAction SilentlyContinue

          Copy-Item "SetupBundle\bin\x86\Release\SetupBundle.exe" "artifacts\installers\SEB_SetupBundle.exe" -ErrorAction SilentlyContinue

          Compress-Archive -Path "SafeExamBrowser.Runtime\bin\x64\Release\*" -DestinationPath "artifacts\SafeExamBrowser-Portable-x64.zip" -Force

          Get-ChildItem -Path "artifacts" -Recurse | Select-Object FullName, Length

      - name: Upload SafeExamBrowser.Browser.dll (x64)
        uses: actions/upload-artifact@v4
        with:
          name: SafeExamBrowser.Browser-dll-x64
          path: artifacts/dll_x64/SafeExamBrowser.Browser.dll

      - name: Upload SafeExamBrowser.Browser.dll (x86)
        uses: actions/upload-artifact@v4
        with:
          name: SafeExamBrowser.Browser-dll-x86
          path: artifacts/dll_x86/SafeExamBrowser.Browser.dll

      - name: Upload Installers (MSI & EXE)
        uses: actions/upload-artifact@v4
        with:
          name: SEB-Installers
          path: artifacts/installers/

      - name: Upload Full Application (x64 Portable)
        uses: actions/upload-artifact@v4
        with:
          name: SafeExamBrowser-Application-x64
          path: SafeExamBrowser.Runtime/bin/x64/Release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}
          name: SafeExamBrowser ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: true
          body: |
            ## SafeExamBrowser (Audit Build - VM & Remote Session Detection Bypassed)

            > **FOR SECURITY AUDITING & LMS TESTING ONLY**
            > This build is designed for professors and security researchers to audit whether their LMS (Moodle, Canvas, Inspera) correctly validates the **Browser Exam Key (BEK)** and blocks unauthorized or tampered clients inside virtual machines.

            ### Modifications in this Build:
            - **Virtual Machine Detection Bypassed**: `VirtualMachineDetector.IsVirtualMachine()` returns `false`.
            - **Remote Session Detection Bypassed**: `RemoteSessionDetector.IsRemoteSession()` returns `false`.
            - **Issue #910 Fix**: Monaco Editor clipboard copy/paste fix is included.

            ### Testing Procedure:
            1. Run this build inside a Virtual Machine (VMware, VirtualBox, Hyper-V, etc.).
            2. Launch your institutional `.seb` exam configuration.
            3. Verify whether your LMS rejects the connection with a BEK mismatch error.

            ### Downloads:
            - **`SEB_SetupBundle.exe`**: Full installer bundle including .NET & Visual C++ prerequisites (recommended for new installations).
            - **`SEB_x64_Setup.msi`**: Standalone 64-bit Windows Installer.
            - **`SEB_x86_Setup.msi`**: Standalone 32-bit Windows Installer.
            - **`SafeExamBrowser-Portable-x64.zip`**: Standalone / portable version. Extract and run `SafeExamBrowser.exe` directly without installation.
            - **`SafeExamBrowser.Browser.dll`**: Replacement DLL for existing installations.
          files: |
            artifacts/installers/SEB_SetupBundle.exe
            artifacts/installers/SEB_x64_Setup.msi
            artifacts/installers/SEB_x86_Setup.msi
            artifacts/SafeExamBrowser-Portable-x64.zip
            artifacts/dll_x64/SafeExamBrowser.Browser.dll
            artifacts/dll_x86/SafeExamBrowser.Browser.dll
